<svg width="100%" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14151f">
        <animate attributeName="stop-color" values="#14151f;#1a1c2b;#14151f" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#1f2335">
        <animate attributeName="stop-color" values="#1f2335;#262b45;#1f2335" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="nameFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dcfff"/>
      <stop offset="55%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#bb9af7"/>
    </linearGradient>

    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M 46 0 L 0 0 0 46" fill="none" stroke="#2b3352" stroke-width="1" opacity="0.55"/>
      <animateTransform attributeName="patternTransform" type="translate" values="0 0; 46 46; 0 0" dur="14s" repeatCount="indefinite"/>
    </pattern>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dcfff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7dcfff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#7dcfff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <g stroke="#4a5178" stroke-width="1.5" opacity="0.7" fill="none">
    <path d="M24,50 L24,24 L50,24"/>
    <path d="M1150,24 L1176,24 L1176,50"/>
    <path d="M24,270 L24,296 L50,296"/>
    <path d="M1150,296 L1176,296 L1176,270"/>
  </g>

  <rect x="0" y="-100" width="1200" height="100" fill="url(#scan)">
    <animate attributeName="y" values="-100;320;-100" dur="9s" repeatCount="indefinite"/>
  </rect>

  <circle cx="140" cy="80" r="3" fill="#7dcfff" opacity="0.6"><animate attributeName="cy" values="80;62;80" dur="4.5s" repeatCount="indefinite"/></circle>
  <circle cx="1060" cy="240" r="3.5" fill="#bb9af7" opacity="0.55"><animate attributeName="cy" values="240;222;240" dur="5.2s" repeatCount="indefinite"/></circle>
  <circle cx="980" cy="70" r="2.2" fill="#9ece6a" opacity="0.6"><animate attributeName="cy" values="70;88;70" dur="3.8s" repeatCount="indefinite"/></circle>
  <circle cx="190" cy="250" r="2.6" fill="#e0af68" opacity="0.5"><animate attributeName="cy" values="250;233;250" dur="4.1s" repeatCount="indefinite"/></circle>

  <text x="600" y="165" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',monospace" font-size="56" font-weight="700" fill="url(#nameFill)" filter="url(#glow)">Sahil S. Rane</text>

  <text x="600" y="205" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',monospace" font-size="18" fill="#a9b1d6">Full-stack engineer in Mumbai, building with React and Next.js</text>
</svg>
